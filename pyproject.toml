[project]
name = "fsm-python"
version = "0.1.0"
description = "VK chatbot feedback collector"
authors = [
    { name = "netro", email = "hewi@git.com" }
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "vkbottle (>=4.10.0,<5.0.0)",
    "pika (>=1.4.1,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.coverage.run]
branch = true
source = ["app", "helpers", "settings"]
